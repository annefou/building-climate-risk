[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfr-building-risk"
dynamic = ["version"]
description = "Building-level urban pluvial flood risk (Vogelbacher et al. 2026, NHESS): an open, tested implementation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anne Fouilloux", email = "anne.fouilloux@lifewatch.eu" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "geopandas>=1.0", "shapely>=2.0", "scipy"]

[project.urls]
Source = "https://github.com/annefou/pfr-building-risk"

[tool.hatch.version]
path = "src/pfr_building_risk/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.pixi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
