[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "building-climate-risk"
dynamic = ["version"]
description = "Building-level climate risk (social vulnerability x exposure x hazard): hazard-agnostic core, pluvial flood module after Vogelbacher et al. 2026 (NHESS)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anne Fouilloux", email = "anne.fouilloux@lifewatch.eu" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "geopandas>=1.0", "shapely>=2.0", "scipy"]

[project.urls]
Source = "https://github.com/annefou/building-climate-risk"

[tool.hatch.version]
path = "src/building_climate_risk/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.pixi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
